<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>登録確認画面</title>
    <link rel="stylesheet" href="assets/css/register_check.css">
</head>
<body>
    <div class="container register-check-container">
        <!-- サーバー側およびJS側のエラーメッセージ表示領域 -->
        <p id="error-message" class="error-msg"<?= ($errorMessage ?? '') === '' ? ' style="display:none;"' : '' ?>>
            <?= h($errorMessage ?? '') ?>
        </p>

        <!-- 確認画面領域 -->
        <div id="confirm-section" class="section">
            <p class="confirm-lead">以下の内容で登録します。よろしいですか？</p>

            <div class="confirm-list">
                <div class="confirm-item">
                    <span class="confirm-label">ユーザーID</span>
                    <span class="confirm-value"><?= h($user['UserId'] ?? $user['user_id'] ?? '') ?></span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label">名前</span>
                    <span class="confirm-value"><?= h($user['UserName'] ?? $user['user_name'] ?? '') ?></span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label">郵便番号</span>
                    <span class="confirm-value"><?= h($user['ZipCode'] ?? $user['zip_code'] ?? '') ?></span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label">住所</span>
                    <span class="confirm-value"><?= h($user['Address'] ?? $user['address'] ?? '') ?></span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label">電話番号</span>
                    <span class="confirm-value"><?= h($user['TEL'] ?? $user['tel'] ?? '') ?></span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label">秘密の質問</span>
                    <span class="confirm-value"><?= h($secretQuestionText ?? '') ?></span>
                </div>
                <div class="confirm-item">
                    <span class="confirm-label">回答</span>
                    <span class="confirm-value"><?= h($secretAnswer ?? '') ?></span>
                </div>
            </div>

            <form id="check-form" action="register_check.php" method="post">
                <input type="hidden" name="csrf_token" id="csrf-token" value="<?= h($token ?? csrf_token()) ?>">
                <div class="btn-row">
                    <button type="button" id="submit-btn" class="btn-primary">はい</button>
                    <button type="button" id="cancel-btn" class="btn-secondary" onclick="location.href='register.php'">キャンセル</button>
                </div>
            </form>
        </div>

        <!-- 完了画面領域（初期状態は非表示、JSで完了時に表示） -->
        <div id="complete-section" class="section" style="display: none;">
            <p class="complete-message">登録が完了しました！</p>
            <div class="btn-row">
                <button type="button" id="login-page-btn" class="btn-primary" onclick="location.href='login.php'">ログインページ</button>
            </div>
        </div>
    </div>

    <script src="assets/js/register_check.js"></script>
</body>
</html>
