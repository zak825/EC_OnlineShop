<h1 class="page-title">商品の購入</h1>

<?php if ($error !== ''): ?>
  <p class="message message--error"><?= h($error) ?></p>
<?php endif; ?>

<section class="card">
  <h2 class="product-name"><?= h($product['ProductName']) ?></h2>
  <p class="product-price">¥<?= number_format((int)$product['Price']) ?></p>

  <dl class="info-list">
    <dt>ジャンル</dt>
    <dd><?= h($product['GenreName']) ?></dd>

    <dt>出品者</dt>
    <dd><?= h($product['SellerName']) ?></dd>

    <dt>在庫数</dt>
    <dd><?= (int)$product['Stock'] ?></dd>
  </dl>
</section>

<?php if (!$canBuy): ?>
  <p class="message message--warning"><?= h($blockMessage) ?></p>

  <div class="actions">
    <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">戻る</a>
  </div>
<?php else: ?>
  <form method="post" action="purchase.php" class="card" id="purchase-form">
    <input type="hidden" name="productId" value="<?= (int)$product['ProductID'] ?>">
    <input type="hidden" name="csrf_token" value="<?= h($token) ?>">

    <label for="quantity" class="form-label">数量</label>
    <div class="quantity">
      <input type="number" id="quantity" name="quantity" class="form-input"
             value="<?= h($quantity) ?>"
             min="1" max="<?= (int)$product['Stock'] ?>" step="1" required
             data-price="<?= (int)$product['Price'] ?>">
      <p class="quantity__subtotal">小計 <span id="subtotal">¥<?= number_format((int)$product['Price'] * max(1, (int)$quantity)) ?></span></p>
    </div>

    <div class="actions">
      <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">戻る</a>
      <button type="submit" class="btn btn--primary">購入</button>
    </div>
  </form>
<?php endif; ?>
