<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | CSE_EC</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/mypage.css">
</head>
<body>
  <header class="site-header">
    <a href="<?= h(URL_MAIN) ?>" class="site-logo">CSE_EC</a>
  </header>

  <main class="container container--wide">
    <h1 class="page-title">マイページ</h1>

    <?php if (!empty($flash)): ?>
      <p class="message message--<?= h($flash['type']) ?>"><?= h($flash['message']) ?></p>
    <?php endif; ?>

    <?php if (!$loggedIn): ?>
      <!-- ===== 未ログイン ===== -->
      <section class="card login-prompt">
        <p>マイページを見るにはログインしてください。</p>
        <div class="actions">
          <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">メイン画面へ</a>
          <a href="<?= h(URL_LOGIN) ?>?return=<?= urlencode('mypage.php' . ($tab === 'sold' ? '?tab=sold' : '')) ?>" class="btn btn--primary">ログイン</a>
        </div>
      </section>

    <?php else: ?>
      <p class="user-id">ユーザーID：<?= (int)$userId ?></p>

      <!-- ===== 購入した商品 / 出品した商品 の切り替え ===== -->
      <nav class="tabs">
        <a href="mypage.php" class="tabs__item<?= $tab === 'bought' ? ' is-active' : '' ?>">
          購入した商品（<?= count($bought) ?>）
        </a>
        <a href="mypage.php?tab=sold" class="tabs__item<?= $tab === 'sold' ? ' is-active' : '' ?>">
          出品した商品（<?= count($sold) ?>）
        </a>
      </nav>

      <?php if ($tab === 'bought'): ?>
        <!-- ===== 購入した商品 ===== -->
        <?php if (!$bought): ?>
          <p class="empty">履歴なし</p>
        <?php endif; ?>

        <?php foreach ($bought as $item): ?>
          <article class="card item">
            <div class="item__head">
              <h2 class="item__name"><?= h($item['ProductName']) ?></h2>
              <span class="item__price">¥<?= number_format((int)$item['Price']) ?></span>
            </div>
            <dl class="item__meta">
              <dt>出品者</dt><dd><?= h($item['SellerName']) ?></dd>
              <dt>購入日時</dt><dd><?= h(format_datetime($item['SoldDate'])) ?></dd>
            </dl>

            <div class="item__status">
              <?php if ($item['sucre'] !== null): ?>
                <span class="badge badge--done">取引完了</span>
              <?php elseif ((int)$item['ShippingFlag'] === 1): ?>
                <span class="badge badge--wait">発送済み</span>
                <a href="review.php?productId=<?= (int)$item['ProductID'] ?>" class="btn btn--primary btn--small">取引完了（レビューを書く）</a>
              <?php else: ?>
                <span class="badge">未発送</span>
              <?php endif; ?>
            </div>

            <?php if ($item['sucre'] !== null): ?>
              <div class="review-body">
                <p class="review-body__stars" aria-label="評価<?= (int)$item['sucre'] ?>"><?= stars($item['sucre']) ?></p>
                <?php if ($item['revwe'] !== null): ?>
                  <p class="review-body__text"><?= nl2br(h($item['revwe'])) ?></p>
                <?php endif; ?>
              </div>
            <?php endif; ?>
          </article>
        <?php endforeach; ?>

      <?php else: ?>
        <!-- ===== 出品した商品 ===== -->
        <?php if (!$sold): ?>
          <p class="empty">履歴なし</p>
        <?php endif; ?>

        <?php foreach ($sold as $item): ?>
          <article class="card item">
            <div class="item__head">
              <h2 class="item__name"><?= h($item['ProductName']) ?></h2>
              <span class="item__price">¥<?= number_format((int)$item['Price']) ?></span>
            </div>

            <?php if ($item['BuyerName'] === null): ?>
              <div class="item__status">
                <span class="badge">販売中</span>
              </div>
            <?php else: ?>
              <dl class="item__meta">
                <dt>購入者</dt><dd><?= h($item['BuyerUserName'] ?? '不明') ?></dd>
                <dt>購入日時</dt><dd><?= h(format_datetime($item['SoldDate'])) ?></dd>
                <dt>配送先</dt>
                <dd>
                  <?php if ($item['BuyerUserName'] !== null): ?>
                    〒<?= h($item['ZipCode']) ?> <?= h($item['Address']) ?><br>
                    TEL <?= h($item['TEL']) ?>
                  <?php else: ?>
                    不明
                  <?php endif; ?>
                </dd>
              </dl>

              <div class="item__status">
                <?php if ($item['sucre'] !== null): ?>
                  <span class="badge badge--done">取引完了</span>
                <?php elseif ((int)$item['ShippingFlag'] === 1): ?>
                  <span class="badge badge--wait">発送済み</span>
                <?php else: ?>
                  <span class="badge badge--alert">未発送</span>
                  <a href="<?= h(URL_SHIPPING) ?>?productId=<?= (int)$item['ProductID'] ?>" class="btn btn--primary btn--small">発送</a>
                <?php endif; ?>
              </div>

              <?php if ($item['sucre'] !== null): ?>
                <div class="review-body">
                  <p class="review-body__label">購入者からのレビュー</p>
                  <p class="review-body__stars" aria-label="評価<?= (int)$item['sucre'] ?>"><?= stars($item['sucre']) ?></p>
                  <?php if ($item['revwe'] !== null): ?>
                    <p class="review-body__text"><?= nl2br(h($item['revwe'])) ?></p>
                  <?php endif; ?>
                </div>
              <?php endif; ?>
            <?php endif; ?>
          </article>
        <?php endforeach; ?>
      <?php endif; ?>

      <div class="actions">
        <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">メイン画面へ</a>
      </div>
    <?php endif; ?>
  </main>

  <script src="assets/js/common.js"></script>
</body>
</html>
