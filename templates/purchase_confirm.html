    <form method="post" action="purchase_confirm.php" id="confirm-form">
      <!-- セッション切れ時の戻り先に使う -->
      <input type="hidden" name="productId" value="<?= (int)$product['ProductID'] ?>">
      <input type="hidden" name="csrf_token" value="<?= h($token) ?>">

      <div class="actions">
        <button type="submit" name="action" value="cancel" class="btn btn--secondary"
                formnovalidate>キャンセル</button>
        <button type="submit" name="action" value="confirm" class="btn btn--primary"
                id="confirm-button">購入を確定する</button>
      </div>
    </form>
  </main>

  <script>
    // 確定ボタンの二重押し対策（押したらボタンを無効にする）
    document.getElementById('confirm-form').addEventListener('submit', function (e) {
      if (e.submitter && e.submitter.value === 'confirm') {
        // disabled にすると action の値が送られないので hidden で補う
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'action';
        input.value = 'confirm';
        this.appendChild(input);

        e.submitter.disabled = true;
        e.submitter.textContent = '処理中…';
      }
    });
  </script>
