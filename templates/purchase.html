<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-shop | 購入</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/purchase.css">
  <link rel="icon" href="assets/icons/favicon.ico">
</head>

<body>

  <div id="wrap">
  <!--ヘッダー読み込み-->
  <?php require __DIR__ . '/../public/header.php'; ?>


    <main class="container">
      <h1 class="page-title">商品の購入</h1>

      <?php if (!empty($flash)): ?>
      <p class="message message--<?= h($flash['type']) ?>">
        <?= h($flash['message']) ?>
      </p>
      <?php endif; ?>

      <?php if ($error !== ''): ?>
      <p class="message message--error">
        <?= h($error) ?>
      </p>
      <?php endif; ?>

      <section class="card">
        <?php if (!empty($imageUrls)): ?>
        <!-- 商品画像（1枚目を大きく、複数ならサムネイルで切り替え） -->
        <div class="product-gallery">
          <img src="<?= h($imageUrls[0]) ?>" alt="<?= h($product['ProductName']) ?>" class="product-gallery__main">
          <?php if (count($imageUrls) > 1): ?>
          <div class="product-gallery__thumbs">
            <?php foreach ($imageUrls as $i => $url): ?>
            <img src="<?= h($url) ?>" alt="" class="product-gallery__thumb<?= $i === 0 ? ' is-active' : '' ?>">
            <?php endforeach; ?>
          </div>
          <?php endif; ?>
        </div>
        <?php endif; ?>

        <h2 class="product-name">
          <?= h($product['ProductName']) ?>
        </h2>
        <p class="product-price">¥
          <?= number_format((int)$product['Price']) ?>
        </p>

        <dl class="info-list">
          <dt>ジャンル</dt>
          <dd>
            <?= h($product['GenreName']) ?>
          </dd>

          <dt>出品者</dt>
          <dd>
            <?= name_label($product['SellerName']) ?>
          </dd>

          <dt>状態</dt>
          <dd data-live-state>
            <?= h($product['ProductCondition'] ?? '') ?>
          </dd>
          <dt>説明</dt>
          <dd><?= nl2br(h($product['Description'] ?? '')) ?></dd>
        </dl>
      </section>

      <?php if (!$canBuy): ?>
      <p class="message message--warning">
        <?= h($blockMessage) ?>
      </p>

      <div class="actions">
        <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">戻る</a>
      </div>
      <?php else: ?>
      <!-- JS（purchase_status.js）が、買えなくなったときにここへ理由を出す -->
      <p class="message message--warning" data-live-message hidden></p>

      <form method="post" action="purchase.php"
            data-status-url="purchase_status.php"
            data-product-id="<?= (int)$product['ProductID'] ?>">
        <input type="hidden" name="productId" value="<?= (int)$product['ProductID'] ?>">
        <input type="hidden" name="csrf_token" value="<?= h($token) ?>">

        <div class="actions">
          <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">戻る</a>
          <button type="submit" class="btn btn--primary" data-live-buy>購入</button>
        </div>
      </form>
      <?php endif; ?>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/purchase_status.js"></script>
    <script>
      // サムネイルをクリックしたらメイン画像を差し替える
      document.querySelectorAll('.product-gallery__thumb').forEach((thumb) => {
        thumb.addEventListener('click', () => {
          const main = document.querySelector('.product-gallery__main');
          if (main) main.src = thumb.src;
          document.querySelectorAll('.product-gallery__thumb').forEach((t) => t.classList.remove('is-active'));
          thumb.classList.add('is-active');
        });
      });
    </script>

    <!-- フッター読み込み -->
    <?php require __DIR__ . '/../public/footer.php'; ?>

  </div>

</body>

</html>
