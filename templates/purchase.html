<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購入画面 | CSE_EC</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/purchase.css">
</head>

<body>
  <div id="wrap">
    <header class="site-header">
      <a href="<?= h(URL_MAIN) ?>" class="site-logo">CSE_EC</a>
      <!-- マイページへのリンク（どの画面からでも行けるようにヘッダーに置く） -->
      <nav class="site-nav">
        <a href="<?= h(URL_STATUS) ?>" class="site-nav__link">マイページ</a>
      </nav>
    </header>

    <main class="container">
      <h1 class="page-title">商品の購入</h1>

      <?php if (!empty($flash)): ?>
        <p class="message message--<?= h($flash['type']) ?>"><?= h($flash['message']) ?></p>
      <?php endif; ?>

      <?php if ($error !== ''): ?>
        <p class="message message--error"><?= h($error) ?></p>
      <?php endif; ?>

      <section class="card">
        <h2 class="product-name"><?= h($product['ProductName']) ?></h2>
        <p class="product-price">¥<?= number_format((int)$product['Price']) ?></p>

        <dl class="info-list">
          <dt>ジャンル</dt>
          <dd><?= h($product['GenreName']) ?></dd>

          <dt>出品者</dt>
          <dd><?= h($product['SellerName']) ?></dd>

          <dt>状態</dt>
          <dd><?= $product['BuyerUserid'] === null ? '販売中' : '売り切れ' ?></dd>
        </dl>
      </section>

      <?php if (!$canBuy): ?>
        <p class="message message--warning"><?= h($blockMessage) ?></p>

        <div class="actions">
          <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">戻る</a>
        </div>
      <?php else: ?>
        <form method="post" action="purchase.php">
          <input type="hidden" name="productId" value="<?= (int)$product['ProductID'] ?>">
          <input type="hidden" name="csrf_token" value="<?= h($token) ?>">

          <div class="actions">
            <a href="<?= h(URL_MAIN) ?>" class="btn btn--secondary">戻る</a>
            <button type="submit" class="btn btn--primary">購入</button>
          </div>
        </form>
      <?php endif; ?>
    </main>

    <script src="assets/js/common.js"></script>
  </div>
</body>

</html>
