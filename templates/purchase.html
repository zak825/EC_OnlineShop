<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購入画面 | CSE_EC</title>
  <link rel="stylesheet" href="css/purchase.css">
</head>
<body>
  <header class="site-header">
    <a href="main.php" class="site-logo">CSE_EC</a>
  </header>

  <main class="container">
    <h1 class="page-title">商品の購入</h1>

    <?php if ($flash): ?>
      <p class="message message--<?= h($flash['type']) ?>"><?= h($flash['message']) ?></p>
    <?php endif; ?>

    <?php if ($error !== ''): ?>
      <p class="message message--error"><?= h($error) ?></p>
    <?php endif; ?>

    <section class="card">
      <h2 class="product-name"><?= h($product['ProductName']) ?></h2>
      <p class="product-price">¥<?= number_format((int)$product['Price']) ?></p>

      <dl class="info-list">
        <dt>ジャンル</dt>
        <dd><?= h($product['GenreName']) ?></dd>

        <dt>出品者</dt>
        <dd><?= h($product['SellerName']) ?></dd>

        <dt>在庫数</dt>
        <dd><?= (int)$product['Stock'] ?></dd>
      </dl>
    </section>

    <?php if (!$canBuy): ?>
      <p class="message message--warning"><?= h($blockMessage) ?></p>

      <div class="actions">
        <a href="main.php" class="btn btn--secondary">戻る</a>
      </div>
    <?php else: ?>
      <form method="post" action="purchase.php" class="card form">
        <input type="hidden" name="productId" value="<?= (int)$product['ProductID'] ?>">
        <input type="hidden" name="csrf_token" value="<?= h($token) ?>">

        <label for="quantity" class="form-label">数量</label>
        <input type="number" id="quantity" name="quantity" class="form-input"
               value="<?= h($quantity) ?>"
               min="1" max="<?= (int)$product['Stock'] ?>" step="1" required>

        <div class="actions">
          <a href="main.php" class="btn btn--secondary">戻る</a>
          <button type="submit" class="btn btn--primary">購入</button>
        </div>
      </form>
    <?php endif; ?>
  </main>
</body>
</html>
