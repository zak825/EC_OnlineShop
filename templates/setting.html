<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/common.css">

    <link rel="stylesheet" href="assets/css/setting.css">
    <link rel="icon" href="assets/icons/favicon.ico">
</head>

<body class="admin-page">
    <div id="wrap">
        <!-- ヘッダー読み込み -->
        <?php include TEMPLATE_DIR . '/setting_header.html'; ?>

        <main>
            <div class="auth-container">
                <div id="setting-card" class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">システム設定</h1>
                    </div>

                    <?php if (!empty($flash)): ?>
                    <p class="message message--<?= h($flash['type']) ?>">
                        <?= h($flash['message']) ?>
                    </p>
                    <?php endif; ?>

                    <?php if (($errorMessage ?? '') !== ''): ?>
                    <p class="message message--error">
                        <?= h($errorMessage) ?>
                    </p>
                    <?php endif; ?>

                    <?php if (!empty($settings)): ?>
                    <form id="setting-form" action="setting.php" method="post" novalidate>
                        <input type="hidden" name="csrf_token" value="<?= h($token ?? admin_csrf_token()) ?>">

                        <?php foreach ($settings as $setting): ?>
                        <div class="form-group">
                            <label for="setting_<?= h($setting['key']) ?>"><?= h($setting['label']) ?></label>
                            <!-- data-* は setting.js のチェック用（上限・下限、大小関係の相手、リセット時に戻す値） -->
                            <input type="text" id="setting_<?= h($setting['key']) ?>"
                                name="settings[<?= h($setting['key']) ?>]" class="setting-input"
                                value="<?= h($setting['input']) ?>" maxlength="256" inputmode="numeric"
                                data-key="<?= h($setting['key']) ?>"
                                data-label="<?= h($setting['label']) ?>"
                                data-initial="<?= h($setting['initial']) ?>"
                                <?php if ($setting['min'] !== null): ?>
                                data-min="<?= h($setting['min']) ?>" data-max="<?= h($setting['max']) ?>"
                                <?php endif; ?>
                                <?php if ($setting['pairMax'] !== ''): ?>
                                data-pair-max="<?= h($setting['pairMax']) ?>"
                                <?php endif; ?>>
                            <p class="field-error" id="error_<?= h($setting['key']) ?>"><?= h($setting['error']) ?></p>
                        </div>
                        <?php endforeach; ?>

                        <div class="btn-row">
                            <button type="submit" id="confirm-btn" class="btn-main">変更内容を確認</button>
                            <button type="button" id="reset-btn" class="btn-sub">リセット</button>
                            <button type="button" id="cancel-btn" class="btn-sub"
                                onclick="location.href='setting.php?action=cancel'">キャンセル</button>
                        </div>
                    </form>
                    <?php endif; ?>
                </div>
            </div>
        </main>

        <!-- フッター読み込み -->
        <?php require __DIR__ . '/../public/footer.php'; ?>
    </div>

    <script src="assets/js/setting.js"></script>
</body>

</html>
