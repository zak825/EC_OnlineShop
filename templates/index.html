<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メイン画面 | CSE_EC</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <header class="site-header">
    <a href="<?= h(URL_MAIN) ?>" class="site-logo">CSE_EC</a>

    <!-- ===== ヘッダーのボタン（ログイン中 / 未ログインで切り替え） ===== -->
    <nav class="site-nav">
      <?php if ($loggedIn): ?>
        <a href="<?= h(URL_SELL) ?>" class="site-nav__btn">販売</a>
        <a href="<?= h(URL_MYPAGE) ?>" class="site-nav__link"><?= h($userName) ?> さん</a>
        <form action="index.php" method="post" id="logout-form" class="site-nav__form">
          <input type="hidden" name="action" value="logout">
          <input type="hidden" name="csrf_token" value="<?= h($token) ?>">
          <button type="submit" class="site-nav__link site-nav__link--button">ログアウト</button>
        </form>
      <?php else: ?>
        <a href="<?= h(URL_LOGIN) ?>" class="site-nav__btn">ログイン</a>
      <?php endif; ?>
    </nav>
  </header>

  <main class="container container--grid">
    <h1 class="page-title">商品一覧</h1>

    <?php if (!empty($flash)): ?>
      <p class="message message--<?= h($flash['type']) ?>"><?= h($flash['message']) ?></p>
    <?php endif; ?>

    <?php if (!$products): ?>
      <p class="empty">販売中の商品はありません。</p>
    <?php else: ?>
      <!-- ===== 商品一覧 ===== -->
      <ul class="product-list">
        <?php foreach ($products as $item): ?>
          <li class="product">
            <div class="product__body">
              <div class="product__title">
                <h2 class="product__name"><?= h($item['ProductName']) ?></h2>
                <?= product_icon($item['ProductName'], $item['image_url'] ?? null) ?>
              </div>
              <p class="product__price">¥<?= number_format((int)$item['Price']) ?></p>
              <p class="product__meta">
                <span class="product__genre"><?= h($item['GenreName']) ?></span>
                出品者：<?= h($item['SellerName']) ?>
              </p>

              <?php if ($loggedIn && (int)$item['Userid'] === $userId): ?>
                <!-- 自分の出品は購入できないのでボタンを出さない -->
                <span class="product__own">自分の出品</span>
              <?php else: ?>
                <a href="purchase.php?productId=<?= (int)$item['ProductID'] ?>" class="btn btn--primary product__buy">購入</a>
              <?php endif; ?>
            </div>
          </li>
        <?php endforeach; ?>
      </ul>
    <?php endif; ?>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
