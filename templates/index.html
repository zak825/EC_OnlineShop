<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e shop | メイン</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>

<body>
  <div id="wrap">
    <!--ヘッダー読み込み-->
    <?php require __DIR__ . '/../public/header.php'; ?>

    <main class="container container--grid">
      <h1 class="page-title">商品一覧</h1>

      <?php if (!empty($flash)): ?>
        <p class="message message--<?= h($flash['type']) ?>"><?= h($flash['message']) ?></p>
      <?php endif; ?>

      <?php if (!$products): ?>
        <p class="empty">販売中の商品はありません。</p>
      <?php else: ?>
        <!-- ===== 商品一覧 ===== -->
        <ul class="product-list">
          <?php foreach ($products as $item): ?>
            <li class="product">
              <?php if (!empty($item['image_url'])): ?>
                <!-- 商品画像（1枚目をカードのサムネイルにする） -->
                <img src="<?= h($item['image_url']) ?>" alt="<?= h($item['ProductName']) ?>" class="product__image product__image--photo">
              <?php else: ?>
                <!-- 画像が無い商品はジャンル名を枠に出す -->
                <div class="product__image" aria-hidden="true"><?= h($item['GenreName']) ?></div>
              <?php endif; ?>

              <div class="product__body">
                <h2 class="product__name"><?= h($item['ProductName']) ?></h2>
                <p class="product__price">¥<?= number_format((int)$item['Price']) ?></p>
                <p class="product__meta">
                  <span class="product__genre"><?= h($item['GenreName']) ?></span>
                  出品者：<?= name_label($item['SellerName']) ?>
                </p>

                <?php if ($loggedIn && (int)$item['Userid'] === $userId): ?>
                  <!-- 自分の出品は購入できないのでボタンを出さない -->
                  <span class="product__own">自分の出品</span>
                <?php else: ?>
                  <a href="purchase.php?productId=<?= (int)$item['ProductID'] ?>" class="btn btn--primary product__buy">購入</a>
                <?php endif; ?>
              </div>
            </li>
          <?php endforeach; ?>
        </ul>
      <?php endif; ?>
    </main>
  </div>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/index.js"></script>
</body>

</html>
